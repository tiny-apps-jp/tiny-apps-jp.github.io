<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小さなアプリたち</title>
<meta name="description" content="個人で作っている小さなiPhoneアプリのサポートページです。">
<style>
  :root { --bg:#faf8fd; --card:#fff; --text:#23202b; --sub:#6b6578; --accent:#7b4fd6; --line:#e6e1ef; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#16141b; --card:#201d27; --text:#ece9f2; --sub:#a9a3b6; --accent:#b394ff; --line:#332e3d; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif; line-height:1.8; }
  main { max-width:720px; margin:0 auto; padding:40px 16px 64px; }
  h1 { font-size:26px; margin:0 0 4px; }
  .lead { color:var(--sub); margin:0 0 24px; }
  a.app { display:flex; align-items:center; gap:14px; text-decoration:none; color:inherit;
    background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px 16px; margin-top:12px; }
  .mark { width:44px; height:44px; border-radius:11px; background:var(--accent); color:#fff;
    display:grid; place-items:center; font-size:22px; flex:none; }
  .name { font-weight:700; }
  .desc { color:var(--sub); font-size:14px; }
  footer { margin-top:32px; color:var(--sub); font-size:14px; text-align:center; }
</style>
</head>
<body>
<main>
  <h1>小さなアプリたち</h1>
  <p class="lead">個人で作っている、無料・広告なしのiPhoneアプリです。</p>

  <a class="app" href="zenkaiitsu/">
    <span class="mark">✓</span>
    <span>
      <span class="name">前回いつ帳</span><br>
      <span class="desc">不定期にくり返すことの「前回いつ？」を記録して、次の日を提案</span>
    </span>
  </a>


  <a class="app" href="moraimono/">
    <span class="mark" style="background:#c9533f">🎁</span>
    <span>
      <span class="name">もらいもの帳</span><br>
      <span class="desc">もらったもの・あげたものを写真で残して、だれから・いつを思い出す</span>
    </span>
  </a>

  <footer>お問い合わせ：<a href="mailto:k86666387@gmail.com">k86666387@gmail.com</a></footer>
</main>
</body>
</html>
